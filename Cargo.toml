[workspace]
resolver = "3"
members = [
  "crates/*",
]

default-members = [
  "crates/*",
]

[workspace.package]
name = "cos-reverse-proxy"
version = "0.1.0"
edition = "2021"
authors = ["Jeroen <jeroen@flexworks.eu>"]
description = "COS Reverse Proxy"
homepage = "https://github.com/opensourceworks-org/cos-reverse-proxy"
repository = "https://github.com/opensourceworks-org/cos-reverse-proxy"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# [workspace.dependencies]
# pingora = { version = "0.4.0", features = ["proxy", "openssl"] }

[workspace.dependencies]
sfv = "=0.10.4"